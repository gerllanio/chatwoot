name: GTI Work preview image

# Preview builds of the gti-preview branch, never deployed automatically. Builds the GTI "Work" image and publishes it to
# ghcr.io/<owner>/chatwoot with the tags `gti` (latest build of the branch)
# and `gti-<short sha>` (pinned build used for deploys and rollbacks).

on:
  push:
    branches: [gti-preview]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gti-preview-docker
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gems and node_modules (the pre-builder-deps stage) are cached on their own with
      # mode=max: that stage never touches enterprise/, so storing all its layers is safe,
      # and an ordinary change then skips bundle install and pnpm i.
      - name: Build dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: pre-builder-deps
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=gti-deps
          cache-to: type=gha,scope=gti-deps,mode=max

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:preview-${{ env.SHORT_SHA }}
          # mode=min keeps only the final image's layers in the cache, so the
          # intermediate stage holding the official enterprise/ tree is never stored.
          cache-from: |
            type=gha,scope=gti-deps
            type=gha,scope=gti-preview-final
          cache-to: type=gha,scope=gti-preview-final,mode=min
